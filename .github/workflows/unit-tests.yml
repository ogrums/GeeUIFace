name: unit tests

on:
  pull_request:
  push:
    branches:
      - android11-modernize
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: SDK platform
        run: sdkmanager "platforms;android-36"
      - name: Host unit tests
        run: ./gradlew :CommandLib:testDebugUnitTest :app:testDebugUnitTest --stacktrace
