pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        // ijkplayer 0.8.8 n'est plus sur Maven Central ni JCenter.
        maven { url 'https://maven.aliyun.com/repository/public' }
    }
}
rootProject.name = "GeeUIFace"
include ':app'
include ':CommandLib'
include ':library'
include ':GestureFactory'
project(':CommandLib').projectDir = new File('GeeUIBase/CommandLib')
project(':library').projectDir = new File('GeeUIBase/library')
project(':GestureFactory').projectDir = new File('GeeUIBase/GestureFactory')

include ':CommChannel'
include ':Components'
project(':CommChannel').projectDir = new File('GeeUIComponets/CommChannel')
project(':Components').projectDir = new File('GeeUIComponets/Components')
